name: Bug report
description: Report a reproducible package problem.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and actual behavior
      description: What happened? Include the actual JSON output and exit code.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the steps or command and the date you reproduced the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Give the installed package version or commit, exact PHP version, and exact Laravel version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: Remove secrets and personal data before sharing.
