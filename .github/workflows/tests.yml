name: Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHPUnit (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            dependencies: lowest
          - php: '8.3'
            dependencies: stable
          - php: '8.4'
            dependencies: stable
          - php: '8.5'
            dependencies: stable

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.10.3
          coverage: ${{ matrix.php == '8.4' && 'pcov' || 'none' }}
        env:
          update: 'true'

      - name: Verify patched PHP runtime
        run: php .github/scripts/check-php.php

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

      - name: Check actual platform requirements
        run: composer check-platform-reqs

      - name: Audit resolved dependencies
        run: composer audit --locked --no-interaction

      - name: Run tests
        if: matrix.php != '8.4'
        run: composer test

      - name: Test coverage gate
        if: matrix.php == '8.4'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Run tests with complete source coverage
        if: matrix.php == '8.4'
        run: |
          mkdir -p build
          php -d pcov.enabled=1 -d pcov.directory=src vendor/bin/phpunit \
            --coverage-clover build/coverage.xml --log-junit build/junit.xml

      - name: Read installed runtime versions
        if: ${{ always() && matrix.php == '8.4' }}
        run: |
          mkdir -p build
          INSTALLED_COMPOSER_VERSION="$(composer --version --no-ansi | awk 'NR == 1 {print $3}')" php -r 'require "vendor/autoload.php"; echo json_encode([
            "php" => PHP_VERSION,
            "laravel" => ltrim(Composer\InstalledVersions::getPrettyVersion("laravel/framework"), "v"),
            "phpunit" => ltrim(Composer\InstalledVersions::getPrettyVersion("phpunit/phpunit"), "v"),
            "composer" => getenv("INSTALLED_COMPOSER_VERSION"),
          ], JSON_THROW_ON_ERROR);' > build/runtime.json

      - name: Summarize and enforce exact line coverage
        if: ${{ always() && matrix.php == '8.4' }}
        run: python3 .github/scripts/coverage-report.py build/coverage.xml build/junit.xml build/runtime.json build/metrics.json

      - name: Upload coverage results
        if: ${{ always() && matrix.php == '8.4' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: package-coverage
          path: build/
          if-no-files-found: error
