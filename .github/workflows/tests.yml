name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - '**.php'
      - 'composer.json'
      - 'phpunit.xml.dist'
      - '.github/workflows/tests.yml'

jobs:
  tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Exclude Pint on unsupported PHP versions
        if: matrix.php == '8.0' || matrix.php == '8.1'
        run: composer remove --dev --no-interaction --no-update laravel/pint phpstan/phpstan

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-security-blocking

      - name: Run tests
        run: composer test
