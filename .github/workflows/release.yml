name: Release

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z or X.Y.Z tag to preview (never publishes)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate stable tag on master
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: python3 .github/scripts/release-notes.py validate --tag "$RELEASE_TAG"

  tests:
    needs: validate
    if: github.event_name == 'push'
    uses: ./.github/workflows/tests.yml

  phpstan:
    needs: validate
    if: github.event_name == 'push'
    uses: ./.github/workflows/phpstan.yml

  pint:
    needs: validate
    if: github.event_name == 'push'
    uses: ./.github/workflows/pint.yml

  composer-quality:
    needs: validate
    if: github.event_name == 'push'
    uses: ./.github/workflows/composer-quality.yml

  notes:
    needs: [validate, tests, phpstan, pint, composer-quality]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (github.event_name == 'workflow_dispatch' || (needs.tests.result == 'success' && needs.phpstan.result == 'success' && needs.pint.result == 'success' && needs['composer-quality'].result == 'success')) }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate bilingual notes
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_TOKEN: ${{ secrets.RELEASE_NOTES_TOKEN }}
          RELEASE_NOTES_BASE_URL: ${{ secrets.RELEASE_NOTES_BASE_URL }}
          RELEASE_NOTES_MODEL: ${{ secrets.RELEASE_NOTES_MODEL }}
        run: python3 .github/scripts/release-notes.py generate --tag "$RELEASE_TAG"
      - name: Save notes for review or publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  publish:
    needs: [validate, tests, phpstan, pint, composer-quality, notes]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
      - name: Create release once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'Release already exists; keeping its notes unchanged.'
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md --latest
          fi
