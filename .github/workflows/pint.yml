name: Code style

on:
    push:
        paths:
            - '**.php'
            - 'pint.json'
    pull_request:
        paths:
            - '**.php'
            - 'pint.json'

jobs:
    pint:
        name: Laravel Pint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3
                  tools: composer:v2
                  coverage: none

            - name: Install dependencies
              run: composer update --no-interaction --prefer-dist --no-security-blocking

            - name: Check code style
              run: vendor/bin/pint --test
