name: Composer Quality

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: composer-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer:
    name: Manifest, autoload, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:2.10.3
          coverage: none
        env:
          update: 'true'

      - name: Verify patched PHP runtime
        run: php .github/scripts/check-php.php

      - name: Validate manifest
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Check actual platform requirements
        run: composer check-platform-reqs

      - name: Validate optimized autoloading
        run: composer dump-autoload --optimize --strict-psr

      - name: Audit dependencies
        run: composer audit --no-interaction
